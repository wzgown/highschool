services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: highschool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: highschool
      POSTGRES_PASSWORD: HS2025!db#SecurePass88
      POSTGRES_DB: highschool
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - highschool_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highschool"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: highschool_redis
    restart: unless-stopped
    command: redis-server --requirepass HS2025!redis#SecurePass88 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - highschool_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "HS2025!redis#SecurePass88", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: highschool_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      # Server
      - HS_SERVER_HOST=0.0.0.0
      - HS_SERVER_PORT=3000
      - HS_SERVER_MODE=production
      # Database
      - HS_DATABASE_HOST=postgres
      - HS_DATABASE_PORT=5432
      - HS_DATABASE_NAME=highschool
      - HS_DATABASE_USER=highschool
      - HS_DATABASE_PASSWORD=HS2025!db#SecurePass88
      - HS_DATABASE_SSL_MODE=disable
      - HS_DATABASE_MAX_CONNS=20
      # Redis
      - HS_REDIS_HOST=redis
      - HS_REDIS_PORT=6379
      - HS_REDIS_PASSWORD=HS2025!redis#SecurePass88
      - HS_REDIS_DB=0
      # Log
      - HS_LOG_LEVEL=info
      - HS_LOG_FORMAT=json
      # Tracing（OTLP/HTTP 直连 OpenObserve；OO 未启动时 exporter 仅异步失败，不影响服务）
      - HS_TRACING_ENABLED=${HS_TRACING_ENABLED:-true}
      - HS_TRACING_SERVICE_NAME=highschool-backend
      - HS_TRACING_PROTOCOL=${HS_TRACING_PROTOCOL:-http}
      - HS_TRACING_OTLP_ENDPOINT=${HS_TRACING_OTLP_ENDPOINT:-openobserve:5080}
      - HS_TRACING_OTLP_URL_PATH=${HS_TRACING_OTLP_URL_PATH:-/api/default/v1/traces}
      # OpenObserve basic auth（与下方 ZO_ROOT_USER_* 默认值对应；生产请用环境变量覆盖）
      - HS_TRACING_OTLP_HEADERS=${HS_TRACING_OTLP_HEADERS:-Authorization=Basic YWRtaW5AaGlnaHNjaG9vbC5sb2NhbDpIaWdoc2Nob29sIzIwMjZvbw==}
      - HS_TRACING_SAMPLE_RATE=0.1
      # LLM（AI 顾问；key 通过环境注入，勿提交真实值）
      - HS_LLM_PROVIDER=${HS_LLM_PROVIDER:-deepseek}
      - HS_LLM_BASE_URL=${HS_LLM_BASE_URL:-https://api.deepseek.com}
      - HS_LLM_MODEL=${HS_LLM_MODEL:-deepseek-chat}
      - HS_LLM_API_KEY=${HS_LLM_API_KEY:-}
      # WeChat（内容安全 msgSecCheck；未配置时自动降级放行）
      - HS_WECHAT_APPID=wx75a71eee586a2ad3
      - HS_WECHAT_SECRET=${HS_WECHAT_SECRET:-}
      # 功能开关（审核期把提审版本号加入 review_versions；通过后移除并重启即可线上打开）
      - HS_FEATURE_AGENT_ENABLED=${HS_FEATURE_AGENT_ENABLED:-true}
      - HS_FEATURE_REVIEW_VERSIONS=${HS_FEATURE_REVIEW_VERSIONS:-1.7}
      # Tip
      - HS_TIP_ENABLED=true
      - HS_TIP_QR_URL=https://zg.mkfriend.top/static/tip-qr.jpg
    networks:
      - highschool_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== Observability（默认不启动） ====================
  # 启用方式：docker compose --profile observability up -d
  # OpenObserve UI: http://localhost:5080（traces/logs/metrics 一体，含告警）
  # backend 通过 OTLP/HTTP 直连（见上方 HS_TRACING_* 环境变量），无需 collector
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.16.3
    container_name: highschool_openobserve
    restart: unless-stopped
    profiles:
      - observability
    environment:
      ZO_DATA_DIR: /data
      # 生产部署务必通过环境变量覆盖默认账号（与 backend 的 HS_TRACING_OTLP_HEADERS 对应）
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@highschool.local}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Highschool#2026oo}
    volumes:
      - openobserve_data:/data
    ports:
      - "5080:5080"   # UI + OTLP/HTTP
      - "5081:5081"   # gRPC（备用）
    networks:
      - highschool_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openobserve_data:
    driver: local

networks:
  highschool_net:
    driver: bridge
